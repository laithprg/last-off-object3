<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="index.css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <button class="sound-button">🔊</button>

    <div class="welcome-container">
        <h1>برا <span class="pink-span">السالفة</span></h1>
        <button class="welcome-button">العب</button>
    </div>

    <div class="categories-container hidden">
        <h1>اختار <span class="pink-span">كاتيجوري</span> وابدأ <span class="red-span">اللعب</span></h1>
        <div class="couple-category">

            <button class="animals-button">
                <img src="animalsphoto.jpg">
            </button>
            <button class="food-button">
                <img src="foodphoto.jpg">
            </button>
        </div>
        <div class="couple-category">

            <button class="clothes-button">
                <img src="clothesphoto.jpg">
            </button>
            <button class="frutes-button">
                <img src="frutesphoto.jpg">
            </button>
        </div>
        <div class="couple-category">

            <button class="games-button">
                <img src="gamesphoto.jpg">
            </button>
            <button class="random-button">
                <img src="randomphoto.jpg">
            </button>
        </div>
    </div>

    <div class="container1 hidden">
        <h1 class="title-addplayer">اكتب اسمك وانضم الى  <span>اللعبة</span></h1>
       <form class="chooseblyer-form">
           <main>
               <button type="button" class="addplayer-button">
                   + اضافة اللاعب 
                </button>
            </main>
            <footer>
                <div class="playerscounter-div">
                    👥<span class="countplayer-span">0</span> لاعبين 
                </div> 
                <input class="continue-button" type="submit" value="متابعة ->">
            </footer>
        </form>
    </div>

     <div class="startvote-container hidden">
        <h1><span></span> صوت مين برا السالفة</h1>
        <div class="buttonsvote-div">

        </div>
    </div>

    <div class="containerbefore-offobject hidden">
        <h1>اضغط لتعرف مين اللي برا السالفة </h1>
        <button class="beforeoffobject-button">التالي</button>
    </div>

    <div class="mainoffobject-container hidden">
        <div class="offobject-namedisplay">
            <h1 class="vote-h1"></h1>
        </div>
        <button class="resutls-button hidden">النتائج</button>
    </div>

    <div class="resutls-container hidden">
        <h1>نتائج الجولة </h1>
        <div class="result-display ">

            
        </div>
        <div class="returnresults-div">
            <button class="newgame-button">🏠 بداية لعبة جديدة</button>
            <button class="playagain-button">جولة جديدة🔄</button>
        </div>
    </div>



    <script src="index.js"></script>
</body>
</html>
